<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>

const which = new URLSearchParams(location.search).get('k') || 'r1';
const SCENES = which === 'r1' ? [[0, '#FF7A45', '#E8336D']] : [[0, '#3A7BFF', '#8B5CF6']];
function pill(x, y, w, h, col) { g.fillStyle = C.navy; rr(x - w / 2 + 6, y - h / 2 + 9, w, h, h / 2); g.fill(); g.fillStyle = col; rr(x - w / 2, y - h / 2, w, h, h / 2); g.fill(); }
function tag(text, x, y, size, rot) {

  g.fillStyle = C.coral; rr(-w / 2, -h / 2, w, h, 30); g.fill(); g.restore();

}

    arrow(h.hx + 70, h.hy - 108, h.hx - 50, h.hy - 108, C.sun, 16);
    pill(CX + 40, 1580, 600, 96, '#fff'); txt('Masa başında yap', CX + 40, 1583, 48, C.navy, { weight: 800 });
  }
}
